
<div class="appointment-container center">
    <div class="name">{{ appointment.patientName}}</div>
    <div class="timestamps">
        <div>{{appointment.startTime}}</div>
        <div>{{appointment.endTime}}</div>
    </div>
    <button class="btn btn-danger" (click)="deleteAppointment()">Eliminar</button>
</div>
