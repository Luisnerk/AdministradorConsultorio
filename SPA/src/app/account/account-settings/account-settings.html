@if (currentUser) {
    <div class="center">
        <div class="container">
            <h4 class="mb-4">Administración de Cuenta</h4>
            <form [formGroup]="userForm" (ngSubmit)="updateUser()" ngNativeValidate>
                <label for="newUsername" class="form-label">Usuario</label>
                <input type="text" class="form-control mb-2" formControlName="newUsername" required>
                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                <input type="password" class="form-control mb-2" placeholder="Dejar en blanco para no cambiar" formControlName="newPassword">
                <label for="currentPassword" class="form-label">Contraseña Actual</label>
                <input type="password" class="form-control" formControlName="currentPassword" required>
                <div class="btn-container">
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
}
