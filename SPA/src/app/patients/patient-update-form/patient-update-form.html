<div>
    <form [formGroup]="updateForm" (ngSubmit)="update()">
    <fieldset>
        <div>
            <label for="name" class="form-label mt-4">Nombre</label>
            <input type="text" class="form-control" id="nameInput" formControlName="name">
        </div>
        <div>
            <label for="dateOfBirth" class="form-label mt-4">Fecha de nacimiento</label>
            <input type="date" class="form-control" id="bornDateInput" formControlName="dateOfBirth">
        </div>
        <br>
        <div class="modal-footer center">
            <button type="button" class="btn btn-primary" (click)="update()">Guardar</button>
            <button type="button" class="btn btn-secondary" style="margin-left: 10px;" (click)="toggleEditFunc()">Cancelar</button>
        </div>
    </fieldset>
</form>
</div>
