<form [formGroup]="registerForm" (ngSubmit)="register()">
    <fieldset>
        <div>
            <label for="name" class="form-label mt-4">Nombre</label>
            <input type="text" class="form-control" id="nameInput" formControlName="name">
        </div>
        <div>
            <label for="dateOfBirth" class="form-label mt-4">Fecha de nacimiento</label>
            <input type="date" class="form-control" id="bornDateInput" formControlName="dateOfBirth">
        </div>
        <br>
        <div class="modal-footer">
            <button type="submit" class="btn btn-primary" data-bs-toggle="modal">Guardar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="resetForm()">Cancelar</button>
        </div>
    </fieldset>
</form>
