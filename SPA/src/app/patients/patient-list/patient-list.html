
<div class="content">
  <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#miModal">Agregar</button>
  <app-patient-modal [modalForm]="modalForm"></app-patient-modal>
  <div class="center">
    <table class="table table-hover">
      <thead>
        <tr class="table-primary">
          <th>Paciente</th>
          <th>Edad</th>
        </tr>
      </thead>
      <tbody>
        @for (patient of patients; track patient.id) {
        <tr (click)="onRowClick(patient.id)">
          <td>
            {{ patient.name }}
          </td>
          <td>
            {{ patient.age }}
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
@if (pagination) {
  <div class="center">
    <pagination [totalItems]="pagination.totalItems" [itemsPerPage]="pagination.itemsPerPage" [maxSize]="10" [(ngModel)]="pagination.currentPage" (pageChanged)="pageChanged($event)"></pagination>
  </div>
}
